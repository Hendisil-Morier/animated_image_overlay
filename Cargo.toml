[package]
name = "animated_image_widget"
version = "0.1.0"
edition = "2024"
description = "Self-contained Wayland wlr-layer-shell animated image overlay"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"

tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

fast_image_resize = "6.1"
image = "0.25"
lz4_flex = "0.14"
webp-animation = "0.10"

calloop = { version = "0.14", features = ["signals"] }
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
